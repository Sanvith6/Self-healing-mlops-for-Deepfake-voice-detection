[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-mlops-deepfake-voice-detection"
version = "0.1.0"
description = "Baseline deepfake voice detection with simple self-healing MLOps loop"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sanvith6" }]
dependencies = []

[project.scripts]
shmlops = "self_healing_mlops.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
